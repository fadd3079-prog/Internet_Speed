name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches version
        shell: pwsh
        run: |
          $cmakeContent = Get-Content CMakeLists.txt -Raw
          if ($cmakeContent -match 'VERSION\s+(\d+\.\d+\.\d+)') {
            $cmakeVersion = $Matches[1]
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($cmakeVersion -ne $tagVersion) {
              throw "Version mismatch: CMake=$cmakeVersion, Tag=$env:GITHUB_REF_NAME"
            }
            Write-Host "Version validated: $env:GITHUB_REF_NAME matches CMake $cmakeVersion"
          } else {
            throw "Could not extract version from CMakeLists.txt"
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare release files
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter InternetSpeed.exe -Recurse |
            Where-Object { $_.FullName -notmatch "\\CMakeFiles\\" } |
            Select-Object -First 1

          if (-not $exe) {
            throw "InternetSpeed.exe tidak ditemukan."
          }

          Copy-Item $exe.FullName ".\InternetSpeed-win-x64.exe" -Force

      - name: Upload unsigned executable for signing
        id: upload-unsigned
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: .\InternetSpeed-win-x64.exe
          if-no-files-found: error

      - name: Sign executable with SignPath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: .\signed

      - name: Use signed executable
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path .\signed -Filter *.exe -Recurse |
            Select-Object -First 1

          if (-not $signed) {
            throw "Signed exe tidak ditemukan."
          }

          Copy-Item $signed.FullName ".\InternetSpeed-win-x64.exe" -Force
          Write-Host "Signed executable diterapkan."

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\InternetSpeed-win-x64.exe" -Algorithm SHA256).Hash

          "$hash *InternetSpeed-win-x64.exe" |
            Set-Content ".\InternetSpeed-win-x64.sha256"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload `
              $tag `
              ".\InternetSpeed-win-x64.exe" `
              ".\InternetSpeed-win-x64.sha256" `
              --clobber
          }
          else {
            gh release create `
              $tag `
              ".\InternetSpeed-win-x64.exe" `
              ".\InternetSpeed-win-x64.sha256" `
              --title "Internet Speed $tag" `
              --generate-notes `
              --verify-tag
          }
